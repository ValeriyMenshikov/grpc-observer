[project]
name = "grpc-observer"
version = "0.1.0"
description = "Observe grpcio client calls (sync and grpc.aio, all four call kinds) with plain hook methods"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# Floors are measured by the test suite, see .github/workflows/ci.yml. Newer Pythons need newer releases:
# the first grpcio with wheels for them, the first protobuf that imports on 3.14.
dependencies = [
    "grpcio>=1.65.1",
    "grpcio>=1.66.2; python_version >= '3.13'",
    "grpcio>=1.75.1; python_version >= '3.14'",
    "protobuf>=5.26",
    "protobuf>=5.27; python_version >= '3.14'",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

[project.optional-dependencies]
status = ["googleapis-common-protos>=1.63.1"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "googleapis-common-protos>=1.63.1",
    "allure-pytest>=2.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grpc_observer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
